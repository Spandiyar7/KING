backend:
  name: git-gateway
  branch: main

# Локальное тестирование: `npx decap-server` + `npm run dev`, затем /admin/ → «Work with Local Backend».
local_backend: true

locale: ru
publish_mode: simple

media_folder: "public/images/catalog"
public_folder: "/images/catalog"

site_url: https://kingatelier.kz
display_url: https://kingatelier.kz

collections:
  - name: products
    label: "Позиции (товары)"
    label_singular: "Позиция"
    description: >-
      Все карточки мебели. Чтобы найти нужное — нажмите фильтр по категории сверху.
      Чтобы удалить позицию — откройте её и в меню (⋯ справа сверху) выберите «Delete».
      Чтобы добавить — кнопка «New Позиция»: выберите категорию, загрузите фото (первое = обложка), впишите цену.
    folder: "content/products"
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.name}}"
    identifier_field: name
    summary: "{{name}}  ·  {{category}}  ·  {{subtitle}}  ·  {{price}} ₸"
    sortable_fields: ["order", "name", "price", "category"]
    view_groups:
      - { label: "По категории", field: category }
    view_filters:
      - { label: "Диваны", field: category, pattern: "sofas" }
      - { label: "Кресла", field: category, pattern: "armchairs" }
      - { label: "Кровати", field: category, pattern: "beds" }
      - { label: "Пуфы", field: category, pattern: "poufs" }
      - { label: "Банкетки", field: category, pattern: "benches" }
      - { label: "Шкафы", field: category, pattern: "cabinets" }
      - { label: "Гардеробные", field: category, pattern: "wardrobes" }
      - { label: "Кухни", field: category, pattern: "kitchens" }
    fields:
      - { label: "Артикул (уникальный)", name: "name", widget: "string", hint: "Уникальное имя-код, напр. KING S62. По нему создаётся адрес позиции." }
      - label: "Категория"
        name: "category"
        widget: "select"
        default: "sofas"
        options:
          - { label: "Диваны (с ценой)", value: "sofas" }
          - { label: "Кресла (с ценой)", value: "armchairs" }
          - { label: "Кровати (с ценой)", value: "beds" }
          - { label: "Пуфы (с ценой)", value: "poufs" }
          - { label: "Банкетки (с ценой)", value: "benches" }
          - { label: "Шкафы (по запросу)", value: "cabinets" }
          - { label: "Гардеробные (по запросу)", value: "wardrobes" }
          - { label: "Кухни (по запросу)", value: "kitchens" }
      - label: "Фотографии (первая = обложка)"
        name: "images"
        widget: "list"
        summary: "{{fields.image}}"
        field: { label: "Фото", name: "image", widget: "image" }
      - label: "Цена, ₸"
        name: "price"
        widget: "number"
        required: false
        value_type: "int"
        min: 0
        hint: "Оставьте пустым для «Цена по запросу» (шкафы, гардеробные, кухни)."
      - { label: "Название на карточке", name: "subtitle", widget: "string", hint: "Короткий заголовок, напр. S62 или «Aurora»." }
      - { label: "Порядок сортировки", name: "order", widget: "number", value_type: "int", required: false, default: 500, hint: "Меньше число — выше в списке своей категории." }
      - { label: "Полное описание", name: "description", widget: "text", required: false }
      - label: "Коллекция"
        name: "collection"
        widget: "select"
        required: false
        default: ""
        options:
          - { label: "— без коллекции —", value: "" }
          - { label: "King Terra", value: "terra" }
          - { label: "King Cloud", value: "cloud" }
          - { label: "King Soft", value: "soft" }
          - { label: "King Bloom", value: "bloom" }
          - { label: "King Savoy", value: "savoy" }
      - { label: "Материал обивки", name: "material", widget: "string", required: false, hint: "Boucle, Велюр, Рогожка…" }
      - { label: "Мягкость", name: "softness", widget: "string", required: false }
      - { label: "Цвет (код)", name: "color", widget: "string", required: false, hint: "ivory / terracotta / olive / brown / blue / grey" }
      - { label: "Цвет (текст)", name: "tone", widget: "string", required: false }
      - { label: "Форма", name: "form", widget: "string", required: false }
      - { label: "Посадочные места", name: "seats", widget: "string", required: false }
      - { label: "Ширина, см", name: "width", widget: "string", required: false }
      - { label: "Глубина, см", name: "depth", widget: "string", required: false }
      - { label: "Высота, см", name: "height", widget: "string", required: false }
      - { label: "Показывать на главной", name: "featured", widget: "boolean", default: false, required: false }

  - name: "settings"
    label: "Настройки сайта"
    files:
      - name: "site"
        label: "Контакты и тексты"
        file: "content/settings/site.json"
        fields:
          - { label: "Телефон (как показывать)", name: "phone", widget: "string" }
          - { label: "Телефон (ссылка)", name: "phoneHref", widget: "string", hint: "Формат: tel:+77070000055" }
          - { label: "WhatsApp (как показывать)", name: "whatsapp", widget: "string" }
          - { label: "WhatsApp (ссылка)", name: "whatsappHref", widget: "string", hint: "Формат: https://wa.me/77070000055" }
          - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "Instagram (ссылка)", name: "instagramHref", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Город", name: "city", widget: "string" }
          - { label: "Адрес мастерской", name: "workshopAddress", widget: "string", required: false }
          - { label: "Заголовок на главной (герой)", name: "heroTitle", widget: "string" }
          - { label: "Текст под заголовком (герой)", name: "heroSubtitle", widget: "text" }
          - { label: "Заголовок блока «Интро»", name: "introTitle", widget: "string" }
          - { label: "Текст блока «Интро»", name: "introText", widget: "text" }
          - { label: "Фото мастерской (на главной)", name: "workshopImage", widget: "image" }
